services:
  db:
    image: mysql:8.4
    container_name: jet5_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jet5_db
      MYSQL_USER: jet5_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-jet5_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-jet5_root_password}
    volumes:
      - jet5_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-jet5_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jet5_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "0"
      DB_HOST: db
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: jet5_db
      DB_USER: jet5_user
      DB_PASSWORD: ${DB_PASSWORD:-jet5_password}
      START_NOTIFICATION_SCHEDULER: "0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jet5_scheduler
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "0"
      DB_HOST: db
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: jet5_db
      DB_USER: jet5_user
      DB_PASSWORD: ${DB_PASSWORD:-jet5_password}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    command: python manage.py run_notification_scheduler

volumes:
  jet5_mysql_data:
